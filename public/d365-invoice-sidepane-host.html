<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Invoice AI Agent Host</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #agentFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    #loadingNotice {
      display: none;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <!--
    Active Cloudflare Live URLs:
    - Sales Agent:   https://moscow-configuration-basics-headline.trycloudflare.com/widget
    - Invoice Agent: https://moscow-configuration-basics-headline.trycloudflare.com/invoice
  -->
  <iframe id="agentFrame" src="https://moscow-configuration-basics-headline.trycloudflare.com/invoice"
    allow="clipboard-read; clipboard-write; microphone"
    onload="console.log('Invoice AI Agent widget loaded successfully')">
  </iframe>

  <script>
    var CLOUDFLARE_BASE = "https://moscow-configuration-basics-headline.trycloudflare.com";
    var SALES_AGENT_URL = CLOUDFLARE_BASE + "/widget";
    var INVOICE_AGENT_URL = CLOUDFLARE_BASE + "/invoice";

    // Forward URL parameters (e.g., entity ID, record name) to iframe if present
    try {
      var currentParams = window.location.search;
      if (currentParams) {
        var frame = document.getElementById('agentFrame');
        if (frame && !frame.src.includes('?')) {
          frame.src = INVOICE_AGENT_URL + currentParams;
        }
      }
    } catch (e) { }

    // Handle messages from inner widget iframe
    window.addEventListener('message', function (event) {
      if (!event || !event.data) return;

      // 1. Close sidepane
      if (event.data.action === 'close_d365_invoice_sidepane' || event.data === 'close_d365_invoice_sidepane') {
        try {
          var xrm = window.Xrm || (window.parent && window.parent.Xrm) || (window.top && window.top.Xrm);
          if (xrm && xrm.App && xrm.App.sidePanes) {
            if (typeof xrm.App.sidePanes.getSelectedPane === 'function') {
              var p = xrm.App.sidePanes.getSelectedPane();
              if (p && p.close) p.close();
            }
            if (typeof xrm.App.sidePanes.getPane === 'function') {
              var p2 = xrm.App.sidePanes.getPane('InvoiceAIAgentSidePane');
              if (p2 && p2.close) p2.close();
            }
          }
        } catch (err) { }
      }

      // 2. Open Dynamics 365 record in-place without page reload
      if (event.data.action === 'open_d365_record') {
        try {
          var xrmNav = (window.top && window.top.Xrm) || (window.parent && window.parent.Xrm) || window.Xrm;
          if (xrmNav && xrmNav.Navigation && typeof xrmNav.Navigation.openForm === 'function') {
            var cleanId = String(event.data.entityId || '').replace(/[{}]/g, '').trim();
            xrmNav.Navigation.openForm({
              entityName: event.data.entityName || 'invoice',
              entityId: cleanId,
              openInNewWindow: false
            });
            return;
          }
        } catch (err) { }
      }
    });
  </script>
</body>

</html>

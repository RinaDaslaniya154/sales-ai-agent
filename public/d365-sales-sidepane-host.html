<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sales AI Agent Host</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #agentFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Cloudflare Live Tunnel URL for Sales AI Agent -->
  <iframe 
    id="agentFrame"
    src="https://tongue-regression-matters-part.trycloudflare.com/widget" 
    allow="clipboard-read; clipboard-write; microphone"
    onload="console.log('Sales AI Agent widget loaded successfully')">
  </iframe>

  <script>
    // Forward URL parameters (Lead ID, Name, data) to iframe
    try {
      var currentParams = window.location.search;
      if (currentParams) {
        var frame = document.getElementById('agentFrame');
        if (frame) {
          // If params contain data=... decode it
          var urlParams = new URLSearchParams(currentParams);
          var dataVal = urlParams.get('data');
          if (dataVal) {
            frame.src = "https://tongue-regression-matters-part.trycloudflare.com/widget?" + dataVal;
          } else {
            frame.src = "https://tongue-regression-matters-part.trycloudflare.com/widget" + currentParams;
          }
        }
      }
    } catch(e) {
      console.error('Error forwarding params:', e);
    }
  </script>
</body>
</html>

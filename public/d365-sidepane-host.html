<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Invoice AI Agent Host</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #agentFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #loadingNotice {
      display: none;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- Live URL for Invoice AI Agent -->
  <iframe 
    id="agentFrame"
    src="https://roots-earn-lottery-mhz.trycloudflare.com/invoice" 
    allow="clipboard-read; clipboard-write; microphone"
    onload="console.log('Invoice AI Agent widget loaded successfully')">
  </iframe>

  <script>
    // Forward URL parameters (e.g., entity ID, record name) to iframe if present
    try {
      var currentParams = window.location.search;
      if (currentParams) {
        var frame = document.getElementById('agentFrame');
        if (frame && !frame.src.includes('?')) {
          frame.src += currentParams;
        }
      }
    } catch(e) {}
  </script>
</body>
</html>
